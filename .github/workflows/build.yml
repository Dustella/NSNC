name: Build packages

# Stage 1: Windows (zip + MSI, unsigned) and Android (release-signed).
# Stage 2: Linux x64 (tar.gz, .deb, Arch, AppImage) and macOS universal
#          (both unsigned; macOS is ad-hoc signed only).
# Pushing a v* tag that matches pubspec.yaml's version publishes a GitHub Release.
# iOS (stage 3) is added later.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  windows:
    name: Windows (x64, unsigned)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build
        run: flutter build windows --release

      - name: Install WiX Toolset
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.UI.wixext/5.0.2

      - name: Package (zip + MSI)
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)').Matches[0].Groups[1].Value
          # MSI versions are numeric only: 0.1.0+1 -> 0.1.0.1
          $msiVersion = $version -replace '\+', '.'
          $name = "nsnc-$version-windows-x64"
          $release = (Resolve-Path 'build\windows\x64\runner\Release').Path
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "$release\*" -DestinationPath "dist\$name.zip"
          wix build packaging/windows/nsnc.wxs -arch x64 -ext WixToolset.UI.wixext `
            -d "Version=$msiVersion" -d "ReleaseDir=$release" `
            -d "IconPath=windows\runner\resources\app_icon.ico" `
            -o "dist\$name.msi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist | Format-Table Name, Length
          "ARTIFACT=$name" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify MSI installs and uninstalls
        shell: pwsh
        run: |
          $msi = (Get-ChildItem dist\*.msi).FullName
          $p = Start-Process msiexec -ArgumentList '/i', "`"$msi`"", '/qn', '/l*v', 'install.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 60; exit $p.ExitCode }
          $exe = Join-Path $env:ProgramFiles 'NSNC\nsnc.exe'
          if (-not (Test-Path $exe)) { throw "nsnc.exe not installed at $exe" }
          if (-not (Test-Path (Join-Path $env:ProgramFiles 'NSNC\data\flutter_assets'))) { throw 'data\ folder missing' }
          $lnk = Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs\NSNC.lnk'
          if (-not (Test-Path $lnk)) { throw "Start Menu shortcut missing at $lnk" }
          Write-Host "Installed OK: $exe"
          $p = Start-Process msiexec -ArgumentList '/x', "`"$msi`"", '/qn' -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
          if (Test-Path $exe) { throw 'nsnc.exe still present after uninstall' }
          Write-Host 'Uninstalled OK'

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux (x64, unsigned)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libmpv-dev \
            imagemagick patchelf desktop-file-utils

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build
        run: flutter build linux --release

      - name: Package
        run: |
          version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml)"
          name="nsnc-$version-linux-x64"
          mkdir -p dist
          # Top-level folder inside the archive is named after the artifact.
          tar -C build/linux/x64/release --transform "s,^bundle,$name," \
            -czf "dist/$name.tar.gz" bundle
          echo "ARTIFACT=$name" >> "$GITHUB_ENV"

      - name: Build and verify .deb, Arch package and AppImage
        run: |
          version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml)"
          bash packaging/linux/package.sh "$version" build/linux/x64/release/bundle dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS (universal, unsigned)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build
        run: flutter build macos --release

      - name: Package
        run: |
          version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml)"
          name="nsnc-$version-macos-universal"
          app="build/macos/Build/Products/Release/nsnc.app"
          echo "Architectures: $(lipo -archs "$app/Contents/MacOS/nsnc")"
          codesign -dv "$app" 2>&1 | grep -E 'Signature|Identifier' || true

          mkdir -p dist dmg-staging
          ditto -c -k --sequesterRsrc --keepParent "$app" "dist/$name.zip"
          cp -R "$app" dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname NSNC -srcfolder dmg-staging -ov -format UDZO "dist/$name.dmg"
          echo "ARTIFACT=$name" >> "$GITHUB_ENV"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: dist/*
          if-no-files-found: error

  android:
    name: Android (APK + AAB, signed)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          missing=()
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            [ -n "${!name}" ] || missing+=("ANDROID_$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing signing secrets: ${missing[*]}. Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload.jks
          {
            echo "storeFile=upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
          } > android/key.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Build APKs (per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Verify signature
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n1)apksigner"
          for apk in build/app/outputs/flutter-apk/*-release.apk; do
            echo "== $(basename "$apk")"
            "$apksigner" verify --print-certs "$apk" | grep -E 'SHA-256|DN'
            if "$apksigner" verify --print-certs "$apk" | grep -q 'CN=Android Debug'; then
              echo "::error::$apk is signed with the debug key"
              exit 1
            fi
          done

      - name: Package
        run: |
          version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml)"
          mkdir -p dist
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi="$(basename "$apk" | sed -E 's/^app-(.*)-release\.apk$/\1/')"
            cp "$apk" "dist/nsnc-$version-android-$abi.apk"
          done
          cp build/app/outputs/bundle/release/app-release.aab "dist/nsnc-$version-android.aab"
          echo "ARTIFACT=nsnc-$version-android" >> "$GITHUB_ENV"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: dist/*
          if-no-files-found: error

      - name: Remove keystore
        if: always()
        run: rm -f android/app/upload.jks android/key.properties

  # On v* tags: publish every package as a GitHub Release.
  # On other runs: dry run (collect files + checksums, publish nothing), so the
  # release path is exercised on every PR.
  release:
    name: GitHub Release
    needs: [windows, linux, macos, android]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches pubspec version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml)"
          expected="v${version%%+*}"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $version (expected tag $expected)."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Re-run of the same tag: refresh the assets, keep the notes.
            gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" \
              --title "NSNC $tag" --generate-notes --verify-tag
          fi

      - name: Dry run summary
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          echo "Not a v* tag, so nothing was published. A tag would release:"
          ls -l dist
